<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">9º Ano &bull; Estudante Exemplo</p>
  </header>

  <main class="conteiner">
    <!-- Área de cards de resumo -->
    <section class="cards-resumo">
      <div class="card">
        <h3>Média Geral</h3>
        <p id="media-geral" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Total de Faltas</h3>
        <p id="total-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Bom Desempenho</h3>
        <p id="qtd-bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Precisam de Atenção</h3>
        <p id="qtd-atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h3>Frequência</h3>
        <p id="frequencia" class="valor-card">92%</p>
        <span class="subtexto-card">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de disciplinas e notas -->
    <section class="secao-tabela">
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas da tabela serão inseridas pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Script do JavaScript -->
  <script src="script.js"></script>
</body>
</html>
